<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a TargetCam</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#555; --card:#f2f4f7; --accent:#0b5fd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --fg:#ececec; --muted:#a0a6ad; --card:#1e2227; --accent:#6aa9ff; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:32rem; margin:0 auto; }
  h1 { font-size:1.6rem; margin:.5rem 0 1rem; }
  h2 { font-size:1.1rem; margin:1.5rem 0 .5rem; }
  a { color:var(--accent); }
  .card { background:var(--card); border-radius:10px; padding:12px 16px; }
  dl { margin:0; }
  dt { color:var(--muted); font-size:.85rem; margin-top:.5rem; }
  dt:first-child { margin-top:0; }
  dd { margin:0; font:1.15rem ui-monospace, Menlo, Consolas, monospace; overflow-wrap:anywhere; user-select:all; }
  ol { padding-left:1.4rem; }
  li { margin:.4rem 0; }
</style>
</head>
<body>
<main>
  <h1>Join a TargetCam</h1>

  <section id="creds" class="card" hidden>
    <dl>
      <dt>Network name</dt><dd id="ssid"></dd>
      <dt>Password</dt><dd id="password"></dd>
    </dl>
  </section>

  <h2>With the app</h2>
  <ol>
    <li>Install and open the TargetCam app.</li>
    <li>Tap <strong>Join a camera</strong>.</li>
  </ol>

  <h2>Without the app</h2>
  <ol>
    <li>Join this WiFi network in your phone's settings.</li>
    <li>Switch mobile data off.</li>
    <li>Open <a href="http://192.168.4.1">http://192.168.4.1</a>.</li>
  </ol>
</main>
<script>
(function () {
  "use strict";
  // Contract: https://fbeder.github.io/j#<ssid>/<password>, both percent-encoded.
  // Nothing here leaves the page.
  function parseJoinFragment(hash) {
    var s = String(hash || "");
    if (s.charAt(0) === "#") s = s.slice(1);
    var i = s.indexOf("/");
    if (i < 0) return null;
    var ssid, password;
    try {
      ssid = decodeURIComponent(s.slice(0, i));
      password = decodeURIComponent(s.slice(i + 1));
    } catch (e) {
      return null;
    }
    if (ssid === "") return null;
    if (ssid.indexOf("-") < 0) ssid = "TargetCam-" + ssid;
    return { ssid: ssid, password: password };
  }

  function render() {
    var join = parseJoinFragment(location.hash);
    var box = document.getElementById("creds");
    if (join) {
      document.getElementById("ssid").textContent = join.ssid;
      document.getElementById("password").textContent = join.password;
      box.hidden = false;
    } else {
      document.getElementById("ssid").textContent = "";
      document.getElementById("password").textContent = "";
      box.hidden = true;
    }
  }

  render();
  window.addEventListener("hashchange", render);
})();
</script>
</body>
</html>
